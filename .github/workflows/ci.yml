name: CI

on:
  push:
    branches: [ "master", "pre-production", "production" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Load DB schema
        run: mysql -h127.0.0.1 -P3306 -uroot -p123456 < "holiday_dessert分大小寫.sql"

      - name: Run tests
        run: ./mvnw -B test -Dtest='!TicketSeckillIntegrationTest'

      - name: Package application
        run: ./mvnw -B package -DskipTests

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  tag:
    needs: build
    if: github.event_name == 'push' && (github.ref_name == 'pre-production' || github.ref_name == 'production')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push Git tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "pre-production" ]]; then
            prefix="qas"
          else
            prefix="prd"
          fi

          git fetch origin --tags --force

          latest=$(git tag --list "${prefix}.1.0.*" --sort=-version:refname | head -n 1)

          if [[ -z "$latest" ]]; then
            patch=0
          else
            patch="${latest##*.}"
          fi

          next_patch=$((patch + 1))
          tag="${prefix}.1.0.${next_patch}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "$tag"
          git push origin "$tag"

          echo "Created Git tag: $tag"
