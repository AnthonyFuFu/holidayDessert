logging:
  level:
    root: INFO
    # org.springframework: WARN
    # org.hibernate: WARN
    org.apache.kafka: WARN
    org.springframework.data.redis: WARN
    org.springframework.data.repository: WARN
    org.hibernate: WARN
    com.ulisesbocchio: WARN
    com.holidaydessert: DEBUG

  # Logback config
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%level] [%t] %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%level] [%t] [%line] %msg%n"

  file:
    path: ./

# opensearch
