# server port
server:
  port: 8080

  # Spring Web config
  servlet:
    context-path: /holidayDessert

  max-http-request-header-size: "16KB"

spring:
  profiles:
    active: local
    #active: prod,kafka

  # Spring Web config
  servlet:
    multipart:
      max-file-size: "64MB"
      max-request-size: "64MB"

  # thymeleaf config
  thymeleaf:
    prefix: classpath:/templates/
    cache: false

  web:
    resources:
      static-locations: classpath:/static/

  # JPA config
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none

  # DataSource config (HikariCP)
  datasource:
    url: jdbc:mysql://localhost:3306/holiday_dessert?serverTimezone=Asia/Taipei
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

  # google Login (taipeirealgood@gmail.com)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 730279248455-vb75s57ap9ptonvvmvgh3t95iqg5bjav.apps.googleusercontent.com
            client-secret: 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

            # official machine
            # redirect-uri: https://www.holidaydessert.com.tw/holidayDessert/login/oauth2/code/{registrationId}

            # local machine
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile
              - email
            client-name: Google

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://accounts.google.com/o/oauth2/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: name

  # Kafka Bootstrap Servers
  kafka:
    bootstrap-servers: localhost:9092

    # Kafka Properties
    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: PLAIN
      sasl.kerberos.service.name: kafka
      schema.registry.url: http://localhost:8081
      # sasl.jaas.config: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="root" password="123456";'

    # Kafka Producer Properties
    producer:
      retries: 0
      batch-size: 16384
      buffer-memory: 33554432
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer

# Azure OpenAI
azure:
  openai:
    model: gpt-3.5-turbo-16k
    # model: data-team-test
    key: c27f170c6ab241798fbe2ac5db0e8e61
